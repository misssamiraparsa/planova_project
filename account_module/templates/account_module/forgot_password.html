{% load static %}
<link rel="stylesheet" href="{% static 'account_module/css/forgot.css' %}">
<script src="{% static 'account_module/js/forgot.js' %}" defer></script>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-fa="بازیابی رمز عبور | مسیر" data-en="Reset Password | Masir">بازیابی رمز عبور | مسیر</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- لینک‌دهی مستقیم به فایل استایل (بدون تمپلیت تگ جنگو) -->
</head>
<body>
<div class="bg-glow"></div>
<div class="grain"></div>

<nav class="navbar">
    <div class="brand">
        <div class="mark">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <path d="M4 18.5V6.8c0-.9.6-1.6 1.5-1.8 2-.5 5.2-1 6.5-1s4.5.5 6.5 1c.9.2 1.5.9 1.5 1.8v11.7" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M4 18.5c0-.7.5-1.2 1.2-1.3 1.9-.4 4.6-.7 6.8-.7s4.9.3 6.8.7c.7.1 1.2.6 1.2 1.3" stroke="#fff" stroke-width="1.7" stroke-linecap="round"></path>
                <path d="M9 9.3l2 2 3.5-3.8" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
        </div>
        <span class="name">مسیر</span>
    </div>
</nav>

<div class="auth-wrap">
    <div class="glass">
        <h2 data-fa="فراموشی رمز عبور" data-en="Forgot Password">فراموشی رمز عبور</h2>
        <p class="sub" data-fa="ایمیل خود را وارد کنید تا لینک بازیابی حساب برای شما ارسال شود." data-en="Enter your email to receive a password reset link.">
            ایمیل خود را وارد کنید تا لینک بازیابی حساب برای شما ارسال شود.
        </p>

        <form id="ForgotPassForm" method="POST" action="{% url 'forgot_page' %}">
            {% csrf_token %}

            <div class="field">
                <label for="{{ forget_pass_form.email.id_for_label }}" data-fa="آدرس ایمیل" data-en="Email Address">آدرس ایمیل</label>
                <label>
                    <input id="{{ forget_pass_form.email.id_for_label }}" type="email"
                           name="{{ forget_pass_form.email.html_name }}" value="{{ forget_pass_form.email.value|default:'' }}" class="form-control" placeholder="example@domain.com" required autocomplete="email">
                    {% for error in login_form.email.errors %}
                        <p class="error-text">{{ error }}</p>
                    {% endfor %}
                </label>
            </div>


            <button type="submit" class="submit">
                <span data-fa="تایید و ارسال لینک" data-en="Submit & Send Link">تایید و ارسال لینک</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>

            <div class="auth-footer">
                <a href="#" class="back-link">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    <span data-fa="بازگشت به صفحه ورود" data-en="Back to Login">بازگشت به صفحه ورود</span>
                </a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
