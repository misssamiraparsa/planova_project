{% load static %}
<link rel="stylesheet" href="{% static 'account_module/css/reset.css' %}">
<script src="{% static 'account_module/js/reset.js' %}" defer></script>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تغییر کلمه عبور</title>
</head>
<body>
<div class="bg-glow"></div>
<div class="grain"></div>

<nav class="navbar">
  <div class="brand">
    <div class="mark">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M4 18.5V6.8c0-.9.6-1.6 1.5-1.8 2-.5 5.2-1 6.5-1s4.5.5 6.5 1c.9.2 1.5.9 1.5 1.8v11.7" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M4 18.5c0-.7.5-1.2 1.2-1.3 1.9-.4 4.6-.7 6.8-.7s4.9.3 6.8.7c.7.1 1.2.6 1.2 1.3" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
        <path d="M9 9.3l2 2 3.5-3.8" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <span class="name">تغییر رمز عبور</span>
  </div>
</nav>

<div class="wrap">
  <form id="resetForm" class="glass" method="POST">
   {% csrf_token %}

    <h2>تغییر رمز عبور</h2>
    <p class="sub">لطفاً رمز عبور جدید خود را وارد کنید.</p>

    <div class="field">
      <label for="{{ reset_form.password.id_for_label }}">رمز عبور جدید</label>
      <input id="{{ reset_form.password.id_for_label }}"
            name="{{ reset_form.password.html_name }}"
             value="{{ reset_form.password.value|default:'' }}" type="password"
             class="form-control" placeholder="••••••••" required minlength="8">

    </div>

    <div class="field">
      <label for="{{ reset_form.confirm_password.id_for_label }}">تکرار رمز عبور جدید</label>
      <input type="password" id="{{ reset_form.confirm_password.id_for_label }}"
             name="{{ reset_form.confirm_password.html_name }}"
             value="{{ reset_form.confirm_password.value|default:'' }}" class="form-control" placeholder="••••••••"
             required minlength="8">

    </div>

    {% if reset_form.non_field_errors %}
         <div id="errorMsg" class="error-msg" style="display: block;">
           {% for error in reset_form.non_field_errors  %}
               {{ error }}
           {% endfor %}

         </div>
    {% endif %} 

    <button type="submit" class="submit">
      <span>ذخیره رمز جدید</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </button>
  </form>
</div>

</body>
</html>
